name: Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # Lê a versão do Flutter fixada no .fvmrc do repo,
      # pra usar exatamente a mesma versão que o projeto espera.
      - name: Read Flutter version from .fvmrc
        id: fvmrc
        uses: kuhnroyal/flutter-fvm-config-action@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvmrc.outputs.FLUTTER_VERSION }}
          channel: 'stable'
          cache: false

      # Cache desligado de propósito (acima). Dependências git (hive, etc.)
      # já quebraram builds anteriores por causa de clones parciais/corrompidos
      # herdados de runs anteriores via cache. Cada run começa limpo agora.
      # Este passo é uma segurança extra caso o runner reaproveite disco.
      - name: Clear any stale pub git cache
        run: rm -rf ~/.pub-cache/git

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Activate Melos
        run: dart pub global activate melos 2.9.0

      # concurrency=1 evita que múltiplos pacotes do monorepo (hive e
      # hive_flutter, que apontam pro mesmo repo git xal/hive) tentem
      # clonar a mesma dependência git em paralelo e colidam na mesma
      # pasta de cache ao mesmo tempo.
      - name: Melos bootstrap (link workspace packages)
        run: dart pub global run melos bootstrap --concurrency=1

      - name: Create env files
        run: |
          cp packages/fedi_app/env_example.env packages/fedi_app/env_dev.env
          cp packages/fedi_app/env_example.env packages/fedi_app/env_prod.env

      - name: Flutter pub get (fedi_app)
        working-directory: packages/fedi_app
        run: flutter pub get

      # Usa exatamente o mesmo comando que o script oficial
      # `build:android:apk:dev` do melos.yaml do projeto:
      # sem -t / --target, o projeto usa um único lib/main.dart
      # e diferencia o flavor só pela flag --flavor.
      - name: Build APK (dev flavor, debug)
        working-directory: packages/fedi_app
        run: |
          flutter build apk \
            --flavor dev \
            --debug \
            2>&1 | tee build_log.txt

      - name: Upload build log (always, mesmo em falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: packages/fedi_app/build_log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: packages/fedi_app/build/app/outputs/flutter-apk/*.apk
